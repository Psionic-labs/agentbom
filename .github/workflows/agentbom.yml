name: agentbom

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  agentbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./action
        with:
          upload-sarif: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
