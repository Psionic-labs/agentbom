[project]
name = "agentbom"
version = "0.1.0"
description = "Static inventory of the agent context a repository loads: MCP servers, skills, hooks and rules files."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pathspec>=1.1.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
agentbom = "agentbom.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
# Fixtures are scanner input, written the way real repositories write them, and docs are
# prose whose code blocks are sketches.
extend-exclude = ["fixtures", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "TID", "C4", "PIE", "PT", "RET", "PGH"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "The scanner reads files and never runs processes."
"os.system".msg = "The scanner reads files and never runs processes."
"os.popen".msg = "The scanner reads files and never runs processes."
"os.posix_spawn".msg = "The scanner reads files and never runs processes."
"os.startfile".msg = "The scanner reads files and never runs processes."
"asyncio.create_subprocess_exec".msg = "The scanner reads files and never runs processes."
"asyncio.create_subprocess_shell".msg = "The scanner reads files and never runs processes."
"socket".msg = "The scanner makes no network calls."
"urllib.request".msg = "The scanner makes no network calls."
"http.client".msg = "The scanner makes no network calls."
"requests".msg = "The scanner makes no network calls."
"httpx".msg = "The scanner makes no network calls."

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
